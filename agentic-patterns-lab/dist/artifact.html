<title>Agentic Patterns Lab · 智能体设计模式</title>
<!-- 元数据刻意不使用「官方 / 授权 / 合作」一类措辞：这是一个独立项目。 -->
<style>
/* ============================================================
   Agentic Patterns Lab — soft-card learning UI
   White cards on a tinted canvas, large radii, pastel accents.
   System fonts only: fully offline, no network requests.
   ============================================================ */

:root{
  /* ============================================================
     Palette — 橄榄绿(主) · 玫瑰粉(对比) · 主黑 · 暖棕
       #9C9E4A olive  ← 主色
       #F896A3 pink   ← 对比强调
       #242021 black  ← 文字
       #CCBEB3 taupe  ← 中性暖调
     浅色底下这四色直接做文字达不到对比度（绿 2.8:1、粉 2.1:1），
     所以浅色模式的文字和描边取同色系深调，原色留给填充与深色模式。
     ============================================================ */
  --l-bg:#F7F2ED;      --d-bg:#1A1617;
  --l-bg-2:#EBE3DC;    --d-bg-2:#120F10;
  --l-surface:#FFFFFF; --d-surface:#242021;
  --l-surface-2:#FAF6F2; --d-surface-2:#2D2829;
  --l-surface-3:#F1EAE3; --d-surface-3:#383032;
  --l-ink:#242021;     --d-ink:#F3ECE8;
  --l-ink-2:#5C5355;   --d-ink-2:#BAADA9;
  --l-ink-3:#746764;   --d-ink-3:#A99A96;   /* 小字用，需在最深的浅底上仍满足 4.5:1 */
  --l-line:#E7DED6;    --d-line:#3B3335;
  --l-line-2:#F2EBE5;  --d-line-2:#2F2829;
  --l-sienna:#62642A;  --d-sienna:#A6A850;   /* 橄榄绿 · 主色 */
  --l-pink:#B0475C;    --d-pink:#F896A3;     /* 玫瑰粉 · 对比强调 */
  --l-teal:#4E6B3A;    --d-teal:#8FBF6A;     /* 偏绿 · 通过/正确 */
  --l-amber:#75624A;   --d-amber:#CCBEB3;    /* 暖棕 · 提醒 */
  --l-plum:#8E4668;    --d-plum:#E39BB8;
  --l-slate:#5C6151;   --d-slate:#A8AE96;
  --l-moss:#8A8C3F;    --d-moss:#C3C566;
  --l-t-primary:#EEF0DB; --d-t-primary:#2A2D17;
  --l-t-teal:#E8F0E0;  --d-t-teal:#24301B;
  --l-t-amber:#F4EDE5; --d-t-amber:#342C25;
  --l-t-plum:#FAEAF1;  --d-t-plum:#3A2430;
  --l-t-slate:#EDEFE8; --d-t-slate:#292C23;
  --l-t-pink:#FCEAEE;  --d-t-pink:#3B272B;
  /* 米底和白卡的明度差只有 1.13:1，靠明度分不开，所以每层阴影都带一道
     发丝描边（第一层 0 0 0 1px）——卡片的边界由轮廓给，不靠压暗背景。*/
  --l-sh-sm: 0 0 0 1px rgba(36,32,33,.055), 0 1px 2px rgba(36,32,33,.05), 0 5px 14px -7px rgba(36,32,33,.14);
  --d-sh-sm: 0 0 0 1px rgba(255,248,244,.05), 0 1px 2px rgba(0,0,0,.35), 0 5px 14px -7px rgba(0,0,0,.55);
  --l-sh-md: 0 0 0 1px rgba(36,32,33,.06), 0 1px 2px rgba(36,32,33,.05), 0 12px 28px -12px rgba(36,32,33,.2);
  --d-sh-md: 0 0 0 1px rgba(255,248,244,.06), 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -12px rgba(0,0,0,.65);
  --l-sh-lg: 0 0 0 1px rgba(36,32,33,.07), 0 2px 4px rgba(36,32,33,.06), 0 26px 48px -20px rgba(36,32,33,.28);
  --d-sh-lg: 0 0 0 1px rgba(255,248,244,.07), 0 2px 4px rgba(0,0,0,.45), 0 26px 48px -20px rgba(0,0,0,.8);

  /* ---- default binding: light ---- */
  --bg:var(--l-bg); --bg-2:var(--l-bg-2);
  --surface:var(--l-surface); --surface-2:var(--l-surface-2); --surface-3:var(--l-surface-3);
  --ink:var(--l-ink); --ink-2:var(--l-ink-2); --ink-3:var(--l-ink-3);
  --line:var(--l-line); --line-2:var(--l-line-2);
  --sienna:var(--l-sienna); --teal:var(--l-teal); --amber:var(--l-amber);
  --plum:var(--l-plum); --slate:var(--l-slate); --moss:var(--l-moss);
  --t-primary:var(--l-t-primary); --t-teal:var(--l-t-teal); --t-amber:var(--l-t-amber);
  --t-plum:var(--l-t-plum); --t-slate:var(--l-t-slate); --t-pink:var(--l-t-pink);
  --pink:var(--l-pink);
  --sh-sm:var(--l-sh-sm); --sh-md:var(--l-sh-md); --sh-lg:var(--l-sh-lg);

  --r-xl: 26px;
  --r-lg: 20px;
  --r-md: 14px;
  --r-sm: 10px;

  --sans: "Avenir Next","Avenir","PingFang SC","Hiragino Sans GB","Segoe UI",system-ui,sans-serif;
  --mono: "SF Mono","Menlo","Monaco","Consolas",monospace;

  --rail: 264px;
  --maxw: 900px;
}

/* Dark binding. Applied when the OS asks for it (unless the viewer's toggle
   pinned light), and whenever the toggle stamps data-theme="dark". */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:var(--d-bg); --bg-2:var(--d-bg-2);
    --surface:var(--d-surface); --surface-2:var(--d-surface-2); --surface-3:var(--d-surface-3);
    --ink:var(--d-ink); --ink-2:var(--d-ink-2); --ink-3:var(--d-ink-3);
    --line:var(--d-line); --line-2:var(--d-line-2);
    --sienna:var(--d-sienna); --teal:var(--d-teal); --amber:var(--d-amber);
    --plum:var(--d-plum); --slate:var(--d-slate); --moss:var(--d-moss);
    --t-primary:var(--d-t-primary); --t-teal:var(--d-t-teal); --t-amber:var(--d-t-amber);
    --t-plum:var(--d-t-plum); --t-slate:var(--d-t-slate); --t-pink:var(--d-t-pink);
    --pink:var(--d-pink);
    --sh-sm:var(--d-sh-sm); --sh-md:var(--d-sh-md); --sh-lg:var(--d-sh-lg);
  }
}
:root[data-theme="dark"]{
  --bg:var(--d-bg); --bg-2:var(--d-bg-2);
  --surface:var(--d-surface); --surface-2:var(--d-surface-2); --surface-3:var(--d-surface-3);
  --ink:var(--d-ink); --ink-2:var(--d-ink-2); --ink-3:var(--d-ink-3);
  --line:var(--d-line); --line-2:var(--d-line-2);
  --sienna:var(--d-sienna); --teal:var(--d-teal); --amber:var(--d-amber);
  --plum:var(--d-plum); --slate:var(--d-slate); --moss:var(--d-moss);
  --t-primary:var(--d-t-primary); --t-teal:var(--d-t-teal); --t-amber:var(--d-t-amber);
  --t-plum:var(--d-t-plum); --t-slate:var(--d-t-slate); --t-pink:var(--d-t-pink);
  --pink:var(--d-pink);
  --sh-sm:var(--d-sh-sm); --sh-md:var(--d-sh-md); --sh-lg:var(--d-sh-lg);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}

body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink);
  font-size:16px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}

h1,h2,h3,h4{font-weight:800;line-height:1.22;margin:0;letter-spacing:-.02em}
h1{font-size:clamp(30px,4.6vw,50px)}
h2{font-size:23px}
h3{font-size:17px;font-weight:700}
p{margin:0 0 .8em}
a{color:inherit}
code,kbd{font-family:var(--mono)}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:center;gap:12px;
  padding:0 22px;height:66px;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:saturate(1.5) blur(14px);
}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;margin-right:auto;min-width:0}
.brand .mark{font-size:18px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.brand .mark em{font-style:normal;color:var(--sienna)}
.brand .sub{
  font-size:12.5px;color:var(--ink-3);white-space:nowrap;font-weight:500;
  padding-left:11px;border-left:1px solid var(--line);
}
@media(max-width:760px){.brand .sub{display:none}}
/* 390px 上「Agentic Patterns Lab」这行字会直接压到进度环上——
   .mark 是 nowrap，父级 min-width:0 拦不住它，得让它自己能截断。 */
@media(max-width:430px){
  .topbar{gap:8px;padding:0 14px}
  .brand{min-width:0;flex:1 1 auto}
  .brand .mark{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .langtog button{padding:6px 10px}
}

.tb-btn{
  font-family:var(--sans);font-size:13px;font-weight:600;
  background:var(--surface);color:var(--ink-2);
  border:0;border-radius:999px;box-shadow:var(--sh-sm);
  padding:9px 15px;cursor:pointer;white-space:nowrap;
  transition:transform .16s, color .16s, box-shadow .16s;
}
.tb-btn:hover{color:var(--ink);transform:translateY(-1px);box-shadow:var(--sh-md)}
.tb-btn:active{transform:none}

.langtog{display:flex;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--sh-sm)}
.langtog button{
  font-family:var(--sans);font-size:12.5px;font-weight:700;
  background:transparent;border:0;color:var(--ink-3);border-radius:999px;
  padding:6px 14px;cursor:pointer;transition:background .18s,color .18s;
}
.langtog button[aria-pressed="true"]{background:var(--sienna);color:var(--surface)}

.tb-prog{display:flex;align-items:center;gap:10px;background:var(--surface);
  border-radius:999px;padding:6px 15px 6px 8px;box-shadow:var(--sh-sm)}
.tb-prog .ring{width:28px;height:28px;flex:none}
.tb-prog .txt{font-size:12.5px;color:var(--ink-2);font-weight:700;white-space:nowrap}
@media(max-width:600px){.tb-prog .txt{display:none}.tb-prog{padding:6px}}

/* ---------- layout ---------- */
.shell{display:flex;align-items:flex-start;max-width:1360px;margin:0 auto;padding:0 18px 0 8px;gap:6px}

.rail{
  width:var(--rail);flex:none;
  position:sticky;top:66px;height:calc(100vh - 78px);
  overflow-y:auto;overscroll-behavior:contain;
  padding:8px 12px 60px;
}
.rail::-webkit-scrollbar{width:5px}
.rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

.rail .grp{
  font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);padding:18px 14px 8px;
}
.rail a{
  display:flex;align-items:center;gap:10px;
  padding:8px 13px;margin-bottom:2px;text-decoration:none;
  font-size:14px;font-weight:600;color:var(--ink-2);
  border-radius:var(--r-md);line-height:1.35;
  transition:color .15s, background .15s, transform .15s;
}
.rail a:hover{color:var(--ink);background:var(--surface);transform:translateX(2px)}
.rail a.on{color:var(--surface);background:var(--sienna);box-shadow:var(--sh-md)}
.rail a .n{font-size:11.5px;font-weight:700;color:var(--ink-3);width:17px;flex:none;text-align:right}
.rail a.on .n{color:rgba(255,255,255,.72)}
.rail a .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--line);margin-left:auto}
.rail a .dot.seen{background:var(--ink-3)}
.rail a .dot.done{background:var(--teal)}
.rail a.on .dot{background:rgba(255,255,255,.4)}
.rail a.on .dot.done{background:#fff}

.railtoggle{display:none}
main{flex:1;min-width:0;padding:10px 14px 120px}
.wrap{max-width:var(--maxw);margin:0 auto}

@media(max-width:940px){
  .rail{
    position:fixed;top:66px;left:0;z-index:55;background:var(--bg);
    transform:translateX(-102%);transition:transform .24s cubic-bezier(.3,.8,.3,1);
    box-shadow:var(--sh-lg);border-radius:0 var(--r-lg) 0 0;
  }
  .rail.open{transform:none}
  .railtoggle{display:inline-block}
  .shell{padding:0 12px}
  main{padding:6px 4px 100px}
}

/* ---------- home ---------- */
.hero{padding:14px 4px 26px}
.hero .eyebrow{
  display:inline-block;font-size:12.5px;font-weight:700;color:var(--sienna);
  background:var(--t-primary);border-radius:999px;padding:6px 14px;margin-bottom:20px;
}
.hero h1{margin-bottom:16px}
.hero h1 .accent{color:var(--sienna)}
.hero .lede{font-size:16.5px;color:var(--ink-2);max-width:62ch;margin-bottom:22px}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px}
.hero .meta span{
  font-size:12.5px;font-weight:600;color:var(--ink-2);
  background:var(--surface);border-radius:999px;padding:7px 14px;box-shadow:var(--sh-sm);
}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:6px 4px 20px}
.search{
  flex:1;min-width:190px;font-family:var(--sans);font-size:14.5px;color:var(--ink);
  background:var(--surface);border:0;border-radius:999px;box-shadow:var(--sh-sm);
  padding:12px 20px;
}
.search:focus{outline:2px solid var(--sienna);outline-offset:1px}
.search::placeholder{color:var(--ink-3)}

.switch{
  display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;
  font-size:13.5px;font-weight:600;color:var(--ink-2);
  background:var(--surface);border-radius:999px;padding:10px 17px;box-shadow:var(--sh-sm);
  transition:color .15s,transform .15s;
}
.switch:hover{color:var(--ink);transform:translateY(-1px)}
.switch .track{width:32px;height:18px;border-radius:999px;background:var(--surface-3);position:relative;flex:none;transition:background .2s}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch.on .track{background:var(--sienna)}
.switch.on .track::after{transform:translateX(14px)}
.switch input{position:absolute;opacity:0;pointer-events:none}

.partsec{margin:12px 0 34px}
.parthd{display:flex;align-items:center;gap:12px;padding:0 4px 14px;flex-wrap:wrap}
.parthd .pn{
  font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--surface);
  background:var(--sienna);border-radius:999px;padding:4px 11px;
}
.partsec[data-part="0"] .pn{background:var(--pink)}
.partsec[data-part="2"] .pn{background:var(--plum)}
.partsec[data-part="3"] .pn{background:var(--amber)}
.partsec[data-part="4"] .pn{background:var(--teal)}
.partsec[data-part="5"] .pn{background:var(--slate)}
.parthd h2{font-size:20px}
.parthd .pd{font-size:13.5px;color:var(--ink-3);margin-left:auto;text-align:right;font-weight:500}
@media(max-width:660px){.parthd .pd{margin-left:0;text-align:left;width:100%}}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:16px}

.card{
  position:relative;display:flex;flex-direction:column;text-decoration:none;color:inherit;
  background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-sm);
  padding:20px 20px 17px;overflow:hidden;
  transition:transform .2s cubic-bezier(.3,.8,.3,1), box-shadow .2s, opacity .22s;
  animation:cardin .55s cubic-bezier(.25,.8,.3,1) both;
}
@keyframes cardin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--sienna);opacity:0;transition:opacity .2s}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh-lg)}
.card:hover::before{opacity:1}
.card .top{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.card .icon{
  font-size:20px;line-height:1;flex:none;width:42px;height:42px;border-radius:var(--r-md);
  background:var(--t-primary);display:grid;place-items:center;
}
.partsec[data-part="0"] .card .icon{background:var(--t-pink)}
.partsec[data-part="2"] .card .icon{background:var(--t-plum)}
.partsec[data-part="3"] .card .icon{background:var(--t-amber)}
.partsec[data-part="4"] .card .icon{background:var(--t-teal)}
.partsec[data-part="5"] .card .icon{background:var(--t-slate)}
.card .num{font-size:12px;font-weight:800;color:var(--ink-3);margin-left:auto;flex:none;padding-top:4px}
.card h3{font-size:16.5px;margin-bottom:3px}
.card .en{font-size:11.5px;font-weight:600;color:var(--ink-3);letter-spacing:.01em}
.card .one{font-size:13.5px;color:var(--ink-2);line-height:1.62;margin:0 0 14px;flex:1}
.card .foot{display:flex;align-items:center;gap:8px;margin-top:auto}
.card .tag{font-size:11px;font-weight:700;border-radius:999px;padding:4px 10px;
  color:var(--ink-3);background:var(--surface-3)}
.card .tag.core{color:var(--sienna);background:var(--t-primary)}
.card .status{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.card .status.done{color:var(--teal)}
.card .step{
  position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:50%;
  background:var(--sienna);color:var(--surface);display:none;place-items:center;
  font-size:12.5px;font-weight:800;box-shadow:var(--sh-md);
}
body.pathmode .card.core .step{display:grid}
body.pathmode .card.core .num{display:none}
body.pathmode .card:not(.core){opacity:.42}
body.pathmode .card:not(.core):hover{opacity:.9}
.card.hidden{display:none}

/* ---------- pattern page ---------- */
.crumb{font-size:13px;font-weight:600;color:var(--ink-3);margin:0 4px 14px}
.crumb a{color:var(--sienna);text-decoration:none}
.crumb a:hover{text-decoration:underline}

.phd{
  background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--sh-sm);
  padding:28px 30px;margin-bottom:16px;
}
.phd .row{display:flex;align-items:flex-start;gap:18px}
.phd .icon{
  font-size:30px;line-height:1;flex:none;width:64px;height:64px;border-radius:var(--r-lg);
  background:var(--t-primary);display:grid;place-items:center;
}
.phd .no{font-size:12px;font-weight:800;letter-spacing:.05em;color:var(--sienna);margin-bottom:7px;text-transform:uppercase}
.phd h1{font-size:clamp(25px,3.6vw,36px)}
.phd .alias{font-size:13.5px;color:var(--ink-3);margin-top:8px;font-weight:500}
@media(max-width:560px){.phd{padding:22px}.phd .icon{width:52px;height:52px;font-size:25px}}

.sec{
  background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--sh-sm);
  padding:24px 30px 26px;margin-bottom:16px;
}
.sec > .lbl{
  font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:16px;
}
.sec.flush{padding:24px 24px 24px}
@media(max-width:560px){.sec{padding:20px 18px}}

.oneliner{font-size:clamp(18px,2.5vw,23px);line-height:1.55;font-weight:700;color:var(--ink);margin:0}

/* analogy */
.analogy{display:flex;gap:16px;align-items:flex-start;background:var(--t-amber);border-radius:var(--r-lg);padding:20px 22px}
.analogy .big{font-size:32px;line-height:1;flex:none}
.analogy h3{margin-bottom:7px;color:var(--ink)}
.analogy p{margin:0;color:var(--ink-2);font-size:14.5px}

/* two-column panels */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.duo{grid-template-columns:1fr}}
.panel{border-radius:var(--r-lg);padding:19px 21px;background:var(--surface-2)}
.panel .ph{font-size:12.5px;font-weight:800;letter-spacing:.03em;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.panel p{font-size:14.5px;color:var(--ink-2);margin:0}
.panel.bad{background:var(--t-pink)}
.panel.bad .ph{color:var(--pink)}
.panel.good{background:var(--t-teal)}
.panel.good .ph{color:var(--teal)}

.uselists{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.uselists{grid-template-columns:1fr}}
.uselist ul{list-style:none;margin:0;padding:0}
.uselist li{position:relative;padding-left:24px;margin-bottom:11px;font-size:14.5px;color:var(--ink-2);line-height:1.6}
.uselist li:last-child{margin-bottom:0}
.uselist li::before{position:absolute;left:0;top:0;font-weight:800;font-size:13px}
.uselist.yes li::before{content:"✓";color:var(--teal)}
.uselist.no li::before{content:"✕";color:var(--pink)}

/* hard-knowledge facts */
.facts{display:grid;gap:12px}
.fact{background:var(--surface-2);border-radius:var(--r-lg);padding:18px 20px;border-left:4px solid var(--sienna)}
.fact h4{font-size:14.5px;font-weight:800;margin-bottom:7px;color:var(--ink);letter-spacing:-.01em}
.fact p{margin:0;font-size:14.3px;color:var(--ink-2);line-height:1.68}
.fact:nth-child(4n+2){border-left-color:var(--slate)}
.fact:nth-child(4n+3){border-left-color:var(--plum)}
.fact:nth-child(4n+4){border-left-color:var(--moss)}

/* canonical terminology */
.terms{display:grid;gap:10px}
.tm{background:var(--surface-2);border-radius:var(--r-md);padding:14px 17px}
.tm-en{font-family:var(--mono);font-size:13.5px;font-weight:600;color:var(--sienna);letter-spacing:-.01em}
.tm-zh{font-size:13px;font-weight:700;color:var(--ink);margin:3px 0 6px}
.tm p{margin:0;font-size:13.8px;color:var(--ink-2);line-height:1.62}

/* primary sources */
.refs{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.refs li{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;font-size:14px;line-height:1.55}
.refs a{color:var(--sienna);text-decoration:none;font-weight:600;border-bottom:1px solid transparent}
.refs a:hover{border-bottom-color:var(--sienna)}
.refs em{font-style:normal;color:var(--ink-3);font-size:13px;flex-basis:100%}
.rk{
  font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  border-radius:5px;padding:2px 7px;flex:none;
  background:var(--surface-3);color:var(--ink-3);
}
.rk.paper{background:var(--t-plum);color:var(--plum)}
.rk.docs{background:var(--t-slate);color:var(--slate)}
.rk.code{background:var(--t-teal);color:var(--teal)}

/* build path */
/* The palette's black swatch, with the pink as its accent. */
.buildcta{
  display:flex;align-items:center;gap:18px;text-decoration:none;color:inherit;
  background:#242021;border-radius:var(--r-xl);padding:24px 26px;margin:4px 0 26px;
  box-shadow:var(--sh-md);transition:transform .2s, box-shadow .2s;
  position:relative;overflow:hidden;
  /* keeps the card readable as a distinct object on the dark canvas too */
  border:1px solid rgba(156,158,74,.28);
}
.buildcta::after{
  content:"";position:absolute;right:-60px;top:-90px;width:280px;height:280px;
  background:radial-gradient(circle, rgba(156,158,74,.26), rgba(156,158,74,0) 70%);
  pointer-events:none;
}
.buildcta:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.buildcta .bi{font-size:30px;line-height:1;flex:none}
.buildcta h3{color:#9C9E4A;font-size:18px;margin-bottom:5px}
.buildcta p{color:#CCBEB3;font-size:13.8px;margin:0;line-height:1.55}
/* the pink is the contrast accent against the olive + black */
.buildcta .go{
  margin-left:auto;flex:none;font-size:13.5px;font-weight:700;color:#242021;
  background:#F896A3;border-radius:999px;padding:10px 18px;white-space:nowrap;
  position:relative;transition:background .18s;
}
.buildcta:hover .go{background:#FBB3BC}
@media(max-width:720px){
  .buildcta{flex-wrap:wrap;gap:12px}
  .buildcta .go{margin-left:0;width:100%;text-align:center}
}

.railbuild{
  background:var(--t-primary);color:var(--sienna)!important;font-weight:700!important;
  margin-bottom:6px!important;
}
.railbuild.on{background:var(--sienna);color:var(--surface)!important}

.buildstep .bs-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px}
.buildstep .bs-n{
  flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:var(--sienna);color:var(--surface);font-size:15px;font-weight:800;
}
.buildstep h2{font-size:19px;margin-bottom:4px}
.buildstep .bs-goal{font-size:13.5px;color:var(--sienna);font-weight:600}
.buildstep .bs-body{font-size:14.8px;color:var(--ink-2);margin-bottom:14px;line-height:1.72;white-space:pre-line}
.buildstep .code{background:var(--surface-2);border-radius:var(--r-md);padding:16px 18px;margin-bottom:14px}
.buildstep .bs-watch{
  background:var(--t-amber);border-radius:var(--r-md);padding:13px 16px;margin-bottom:14px;
  font-size:14px;color:var(--ink-2);line-height:1.62;
}
.buildstep .bs-watch b{color:var(--amber);font-weight:800}
.buildstep .bs-rel{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.buildstep .bs-rel > span{font-size:12.5px;font-weight:700;color:var(--ink-3)}

/* --- 实战路径：指向真实文件的部件 --- */
.buildstep .bs-file{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12.4px;
  font-weight:600;color:var(--sienna);background:var(--t-primary);
  border-radius:99px;padding:4px 12px;margin-bottom:11px;
}
.buildstep .bs-file::before{content:"📄";font-size:12px}
/* 终端条在深浅两种主题下都保持深色——它模拟的是终端，不该跟着翻转。
   所以这里用固定色值而不是 var(--ink)：后者在深色模式下会变浅，
   配上浅色文字就是 1:1 的隐形字。 */
.bs-run{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;
  background:#242021;border-radius:var(--r-md);padding:11px 15px;overflow-x:auto;
  border:1px solid rgba(156,158,74,.22);
}
.bs-run .p{color:#9C9E4A;font-family:var(--mono);font-size:13px;flex:none;user-select:none}
.bs-run code{color:#F3ECE8;font-family:var(--mono);font-size:13px;white-space:pre}
.bs-out{
  border:1px solid var(--line);border-left:3px solid var(--teal);
  border-radius:var(--r-md);padding:12px 16px;margin-bottom:14px;background:var(--surface-2);
}
.bs-out > b{
  display:block;font-size:11.5px;font-weight:800;letter-spacing:.06em;
  color:var(--ink-3);text-transform:uppercase;margin-bottom:7px;
}
.bs-out pre{
  margin:0;font-family:var(--mono);font-size:12.3px;line-height:1.75;
  color:var(--ink-2);white-space:pre;overflow-x:auto;
}
.bs-out em{
  display:block;margin-top:9px;font-style:normal;
  font-size:12.2px;line-height:1.55;color:var(--ink-3);
}
/* 站点页脚：独立项目声明。只在这一处出现，不在每个页面重复。 */
.sitefoot{
  margin:44px auto 0;padding:26px 0 40px;
  border-top:1px solid var(--line);
}
.sitefoot p{font-size:13.2px;line-height:1.66;color:var(--ink-2);margin:0 0 8px}
.sitefoot p:last-child{margin-bottom:0}
.sitefoot .dim{font-size:12.4px;color:var(--ink-3)}
.sitefoot b{color:var(--ink);font-weight:700}

/* 模式页 → 实战路径的反向链接 */
.handson{
  background:var(--t-primary);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:16px 18px;margin-bottom:var(--gap);
}
.handson .ho-h{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.handson .ho-h b{font-size:13.6px;font-weight:800;color:var(--sienna)}
.handson .ho-row{
  display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r-md);
  background:var(--surface);text-decoration:none;margin-bottom:7px;
  transition:transform .16s ease, box-shadow .16s ease;
}
.handson .ho-row:last-child{margin-bottom:0}
.handson .ho-row:hover{transform:translateX(3px);box-shadow:var(--sh-sm)}
.handson .ho-n{
  flex:none;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;
  background:var(--sienna);color:var(--surface);font-size:12px;font-weight:800;
}
.handson .ho-t{font-size:14px;color:var(--ink);font-weight:600;flex:1}
.handson .ho-row code{
  font-family:var(--mono);font-size:11.6px;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42%;
}
@media(max-width:560px){.handson .ho-row code{display:none}}

.bs-setup{background:var(--surface-2)}
.bs-setup .bs-note{
  font-size:13.6px;color:var(--ink-2);line-height:1.6;
  border-left:3px solid var(--pink);padding-left:13px;margin-top:13px;
}
.bs-setup .bs-note b{color:var(--pink)}

/* numbered list */
.bul{list-style:none;margin:0;padding:0;counter-reset:bi}
.bul li{position:relative;padding-left:34px;margin-bottom:13px;font-size:14.5px;color:var(--ink-2);line-height:1.65}
.bul li:last-child{margin-bottom:0}
.bul li::before{
  content:counter(bi);counter-increment:bi;
  position:absolute;left:0;top:2px;width:23px;height:23px;border-radius:50%;
  background:var(--t-primary);color:var(--sienna);
  font-size:11.5px;font-weight:800;display:grid;place-items:center;
}
.bul li b{color:var(--ink);font-weight:700}

/* ---------- diagram ---------- */
.diagram{border-radius:var(--r-lg);background:var(--surface-2);overflow:hidden}
.diagram .stage{overflow-x:auto;padding:14px 10px 6px}
.diagram svg{display:block;min-width:540px;width:100%;height:auto}
.diagram .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px 16px}
.dbtn{
  font-family:var(--sans);font-size:13px;font-weight:600;
  background:var(--surface);border:0;border-radius:999px;color:var(--ink-2);
  padding:9px 15px;cursor:pointer;box-shadow:var(--sh-sm);
  transition:transform .15s,color .15s,box-shadow .15s,background .15s;
}
.dbtn:hover:not(:disabled){color:var(--ink);transform:translateY(-1px);box-shadow:var(--sh-md)}
.dbtn:disabled{opacity:.4;cursor:default;box-shadow:none}
.dbtn.play{background:var(--sienna);color:var(--surface);font-weight:700}
.dbtn.play:hover:not(:disabled){color:var(--surface)}
.dcount{font-size:12.5px;font-weight:700;color:var(--ink-3);margin-left:auto}
.dsay{
  padding:16px 18px;margin:0 16px;border-radius:var(--r-md);background:var(--surface);
  min-height:64px;font-size:14.5px;color:var(--ink-2);line-height:1.62;box-shadow:var(--sh-sm);
}
.dsay .k{font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--sienna);display:block;margin-bottom:5px}
.dsay.idle{color:var(--ink-3)}

.n-box{transition:opacity .22s}
.n-shape{transition:fill .25s, stroke .25s, stroke-width .25s}
.n-label{font-family:var(--sans);font-size:11.5px;font-weight:600;fill:var(--ink);text-anchor:middle;dominant-baseline:middle}
.n-sub{font-family:var(--sans);font-size:9px;fill:var(--ink-3);text-anchor:middle}
.n-emoji{font-size:15px;text-anchor:middle;dominant-baseline:middle}
.e-path{fill:none;stroke:var(--ink-3);stroke-width:1.5;opacity:.55;transition:stroke .25s, stroke-width .25s, opacity .25s}
.e-path.hot{stroke:var(--sienna);stroke-width:2.6;opacity:1}
.n-box.hot .n-shape{stroke-width:2.6}
.n-box.dim{opacity:.3}
.token{fill:var(--sienna)}
.e-lbl{font-family:var(--sans);font-size:9.5px;font-weight:600;fill:var(--ink-3);text-anchor:middle}

/* ---------- code ---------- */
.codewrap{border-radius:var(--r-lg);overflow:hidden;background:var(--surface-2)}
.codewrap summary{
  cursor:pointer;list-style:none;padding:14px 18px;
  font-size:13px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:9px;
}
.codewrap summary::-webkit-details-marker{display:none}
.codewrap summary::before{content:"▸";color:var(--sienna);transition:transform .2s;display:inline-block;font-size:12px}
.codewrap[open] summary::before{transform:rotate(90deg)}
.codewrap summary:hover{color:var(--ink)}
.code{margin:0;padding:4px 18px 18px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.9}
.code .ln{display:block;white-space:pre}
.code .cm{color:var(--ink-3);font-style:italic}
.code .kw{color:var(--plum);font-weight:600}
.code .st{color:var(--teal)}
.code .fn{color:var(--slate)}
.code .nu{color:var(--amber)}

/* ---------- quiz ---------- */
.quiz{background:var(--surface-2);border-radius:var(--r-lg);padding:20px 22px;margin-bottom:12px}
.quiz .q{font-size:15.5px;font-weight:700;margin-bottom:14px;line-height:1.55}
.quiz .q .qn{
  display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;
  background:var(--sienna);color:var(--surface);font-size:11.5px;font-weight:800;margin-right:9px;
  vertical-align:1px;
}
.opt{
  display:block;width:100%;text-align:left;font-family:var(--sans);font-size:14.5px;color:var(--ink-2);
  background:var(--surface);border:2px solid transparent;border-radius:var(--r-md);
  padding:12px 16px;margin-bottom:8px;cursor:pointer;line-height:1.5;
  transition:border-color .15s,color .15s,transform .15s;
}
.opt:hover:not(:disabled){border-color:var(--line);color:var(--ink);transform:translateX(2px)}
.opt:disabled{cursor:default}
.opt .mk{font-weight:800;color:var(--ink-3);margin-right:10px}
.opt.right{border-color:var(--teal);background:var(--t-teal);color:var(--ink)}
.opt.right .mk{color:var(--teal)}
.opt.wrong{border-color:var(--pink);background:var(--t-pink);color:var(--ink)}
.opt.wrong .mk{color:var(--pink)}
.why{
  margin-top:12px;padding:14px 16px;border-radius:var(--r-md);background:var(--t-primary);
  font-size:14px;color:var(--ink-2);line-height:1.65;
  animation:fadein .3s ease both;
}
@keyframes fadein{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.why .k{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--sienna);display:block;margin-bottom:5px}
.quizscore{font-size:14px;font-weight:700;color:var(--ink-2);padding:6px 4px 0}
.quizscore b{color:var(--teal)}

/* ---------- chips / nav ---------- */
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:600;
  color:var(--ink-2);background:var(--surface-2);
  transition:color .15s,transform .15s,background .15s;
}
.chip:hover{color:var(--sienna);background:var(--t-primary);transform:translateY(-2px)}
.chip .n{font-size:11px;font-weight:800;color:var(--ink-3)}

.pagenav{display:flex;gap:14px;margin-top:4px}
.pagenav a{
  flex:1;text-decoration:none;border-radius:var(--r-lg);padding:16px 20px;
  background:var(--surface);box-shadow:var(--sh-sm);min-width:0;
  transition:transform .18s,box-shadow .18s;
}
.pagenav a:hover{transform:translateY(-3px);box-shadow:var(--sh-md)}
.pagenav .d{font-size:11.5px;font-weight:700;color:var(--ink-3);margin-bottom:5px}
.pagenav .t{font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pagenav a.next{text-align:right}

.srcnote{font-size:12.5px;font-weight:600;color:var(--ink-3);padding:18px 4px 0;text-align:center}

code.ic{
  font-size:.86em;background:var(--surface-3);border-radius:6px;
  padding:2px 7px;color:var(--sienna);font-weight:600;
}

/* ---------- glossary ---------- */
.term{border-bottom:2px dotted var(--ink-3);cursor:help;text-underline-offset:3px}
.term:hover{border-bottom-color:var(--sienna);color:var(--ink)}
#tip{
  position:fixed;z-index:200;max-width:300px;pointer-events:none;opacity:0;
  background:var(--ink);color:var(--bg);border-radius:var(--r-md);padding:12px 15px;
  font-size:13px;line-height:1.58;box-shadow:var(--sh-lg);
  transition:opacity .15s;
}
#tip.show{opacity:1}
#tip .tn{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.6;display:block;margin-bottom:4px}

.empty{padding:60px 0;text-align:center;color:var(--ink-3);font-size:15px}
.scrim{display:none;position:fixed;inset:66px 0 0;background:rgba(10,13,25,.35);z-index:50}
.scrim.on{display:block}
@media(min-width:941px){.scrim{display:none!important}}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
  html{scroll-behavior:auto}
}

<script>
/* ============================================================
   diagram.js — declarative schematic engine
   ------------------------------------------------------------
   Every pattern supplies data, not animation code:

     diagram: {
       w: 720, h: 260,
       nodes: [ {id, kind, label:{zh,en}, sub?, x, y, w?, h?} ],
       edges: [ {from, to, label?:{zh,en}, bend?, via?:[{x,y}], dash?} ],
       steps: [ {edge:'a->b'|node:'id', say:{zh,en}} ]
     }

   The engine draws it, then plays the steps: a data token travels
   the edge, the active node lights up, and everything not yet
   reached stays dimmed so the flow builds up progressively.
   ============================================================ */
(function () {
  'use strict';

  var NS = 'http://www.w3.org/2000/svg';

  // node kind -> accent colour variable + glyph
  // Olive is the primary and marks the agent/model itself; pink is the contrast
  // accent and marks anything that acts on or branches the flow.
  var KINDS = {
    actor:    { c: 'var(--ink-2)',  g: '🧑' },
    prompt:   { c: 'var(--amber)',  g: '📝' },
    agent:    { c: 'var(--sienna)', g: '🤖' },
    llm:      { c: 'var(--sienna)', g: '🧠' },
    tool:     { c: 'var(--pink)',   g: '🔧' },
    memory:   { c: 'var(--plum)',   g: '📚' },
    store:    { c: 'var(--slate)',  g: '🗄️' },
    gate:     { c: 'var(--pink)',   g: '🚦' },
    decision: { c: 'var(--pink)',   g: '🔀' },
    output:   { c: 'var(--teal)',   g: '📤' },
    check:    { c: 'var(--plum)',   g: '🔍' },
    plan:     { c: 'var(--amber)',  g: '🗺️' },
    human:    { c: 'var(--slate)',  g: '🙋' },
    world:    { c: 'var(--moss)',   g: '🌐' }
  };

  var NW = 112, NH = 56;   // default node box
  var el = function (n, a) {
    var e = document.createElementNS(NS, n);
    for (var k in a) if (a[k] != null) e.setAttribute(k, a[k]);
    return e;
  };

  // wrap a label into at most 2 lines (CJK counts double-width)
  function wrap(text, max) {
    var width = function (s) {
      var w = 0;
      for (var i = 0; i < s.length; i++) w += s.charCodeAt(i) > 255 ? 2 : 1;
      return w;
    };
    if (width(text) <= max) return [text];
    // prefer breaking on a space, else break by measured width
    var words = text.split(' ');
    if (words.length > 1) {
      var a = '', b = '';
      for (var i = 0; i < words.length; i++) {
        if (width(a + words[i]) <= max && !b) a += (a ? ' ' : '') + words[i];
        else b += (b ? ' ' : '') + words[i];
      }
      if (a && b) return [a, b];
    }
    var cut = 0, acc = 0;
    for (var j = 0; j < text.length; j++) {
      acc += text.charCodeAt(j) > 255 ? 2 : 1;
      if (acc > max) { cut = j; break; }
    }
    return cut ? [text.slice(0, cut), text.slice(cut)] : [text];
  }

  // where does the segment from node centre toward p leave the node box?
  function edgeOfBox(n, p) {
    var dx = p.x - n.x, dy = p.y - n.y;
    if (!dx && !dy) return { x: n.x, y: n.y };
    var hw = (n.w || NW) / 2 + 5, hh = (n.h || NH) / 2 + 5;
    var sx = dx ? hw / Math.abs(dx) : Infinity;
    var sy = dy ? hh / Math.abs(dy) : Infinity;
    var s = Math.min(sx, sy);
    return { x: n.x + dx * s, y: n.y + dy * s };
  }

  function pathFor(a, b, e) {
    var via = e.via || [];
    if (via.length) {
      var start = edgeOfBox(a, via[0]);
      var end = edgeOfBox(b, via[via.length - 1]);
      var d = 'M' + start.x + ',' + start.y;
      via.forEach(function (p) { d += ' L' + p.x + ',' + p.y; });
      return d + ' L' + end.x + ',' + end.y;
    }
    var s = edgeOfBox(a, b), t = edgeOfBox(b, a);
    if (e.bend) {
      var mx = (s.x + t.x) / 2, my = (s.y + t.y) / 2;
      var vx = t.x - s.x, vy = t.y - s.y;
      var len = Math.hypot(vx, vy) || 1;
      // perpendicular offset
      var cx = mx + (-vy / len) * e.bend, cy = my + (vx / len) * e.bend;
      return 'M' + s.x + ',' + s.y + ' Q' + cx + ',' + cy + ' ' + t.x + ',' + t.y;
    }
    return 'M' + s.x + ',' + s.y + ' L' + t.x + ',' + t.y;
  }

  /**
   * Build a diagram instance inside `host`.
   * Returns { setLang(l), destroy() }.
   */
  function create(host, spec, lang, strings) {
    var byId = {};
    spec.nodes.forEach(function (n) { byId[n.id] = n; });

    var reduce = window.matchMedia &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var uid = 'd' + Math.random().toString(36).slice(2, 8);
    var t = function (o) { return !o ? '' : (typeof o === 'string' ? o : (o[lang] || o.zh || o.en || '')); };

    // ---- shell ----
    host.className = 'diagram';
    var stage = document.createElement('div');
    stage.className = 'stage';
    var svg = el('svg', {
      viewBox: '0 0 ' + spec.w + ' ' + spec.h,
      role: 'img'
    });
    stage.appendChild(svg);

    var defs = el('defs');
    ['arrow', 'arrowHot'].forEach(function (id, i) {
      var m = el('marker', {
        id: uid + id, viewBox: '0 0 10 10', refX: '9', refY: '5',
        markerWidth: '7', markerHeight: '7', orient: 'auto-start-reverse'
      });
      m.appendChild(el('path', {
        d: 'M0,1 L9,5 L0,9 z',
        fill: i ? 'var(--sienna)' : 'var(--ink-3)'
      }));
      defs.appendChild(m);
    });
    svg.appendChild(defs);

    var gEdges = el('g'), gNodes = el('g'), gToken = el('g');
    svg.appendChild(gEdges); svg.appendChild(gNodes); svg.appendChild(gToken);

    // ---- edges ----
    var edgeEls = {};
    spec.edges.forEach(function (e) {
      var a = byId[e.from], b = byId[e.to];
      if (!a || !b) return;
      var p = el('path', {
        d: pathFor(a, b, e),
        class: 'e-path',
        'marker-end': 'url(#' + uid + 'arrow)',
        'stroke-dasharray': e.dash ? '5 4' : null
      });
      gEdges.appendChild(p);
      var lbl = null;
      if (e.label) {
        var mid = p.getPointAtLength ? null : null;
        lbl = el('text', { class: 'e-lbl' });
        gEdges.appendChild(lbl);
      }
      edgeEls[e.from + '->' + e.to] = { path: p, lbl: lbl, def: e };
    });

    // ---- nodes ----
    var nodeEls = {};
    spec.nodes.forEach(function (n) {
      var k = KINDS[n.kind] || KINDS.agent;
      var w = n.w || NW, h = n.h || NH;
      var g = el('g', { class: 'n-box' });
      var shape = el('rect', {
        x: n.x - w / 2, y: n.y - h / 2, width: w, height: h, rx: 14,
        class: 'n-shape', fill: 'var(--surface)', stroke: k.c, 'stroke-width': 1.6
      });
      g.appendChild(shape);
      var glyph = el('text', { class: 'n-emoji', x: n.x, y: n.y - h / 2 + 16 });
      glyph.textContent = n.glyph || k.g;
      g.appendChild(glyph);
      var txt = el('text', { class: 'n-label', x: n.x, y: n.y + 6 });
      g.appendChild(txt);
      var sub = null;
      if (n.sub) {
        sub = el('text', { class: 'n-sub', x: n.x, y: n.y + h / 2 - 6 });
        g.appendChild(sub);
      }
      gNodes.appendChild(g);
      nodeEls[n.id] = { g: g, shape: shape, txt: txt, sub: sub, def: n, kind: k };
    });

    // pool of travelling data tokens (a step may fire several edges at once)
    var tokens = [];
    function tokenAt(i) {
      while (tokens.length <= i) {
        var c = el('circle', { r: 5, class: 'token', opacity: 0 });
        gToken.appendChild(c);
        tokens.push(c);
      }
      return tokens[i];
    }
    function hideTokens() { tokens.forEach(function (c) { c.setAttribute('opacity', 0); }); }

    // ---- controls ----
    var bar = document.createElement('div');
    bar.className = 'bar';
    var bPlay = document.createElement('button'); bPlay.className = 'dbtn play';
    var bPrev = document.createElement('button'); bPrev.className = 'dbtn';
    var bNext = document.createElement('button'); bNext.className = 'dbtn';
    var bReset = document.createElement('button'); bReset.className = 'dbtn';
    var count = document.createElement('span'); count.className = 'dcount';
    bar.appendChild(bPlay); bar.appendChild(bPrev); bar.appendChild(bNext);
    bar.appendChild(bReset); bar.appendChild(count);

    var say = document.createElement('div');
    say.className = 'dsay idle';

    host.appendChild(stage); host.appendChild(say); host.appendChild(bar);

    // ---- state ----
    var cur = -1, playing = false, timer = null, raf = null;

    function labels() {
      spec.nodes.forEach(function (n) {
        var ne = nodeEls[n.id], h = n.h || NH;
        var lines = wrap(t(n.label), (n.w || NW) > 130 ? 22 : 15);
        ne.txt.textContent = '';
        if (lines.length === 1) {
          ne.txt.setAttribute('y', n.y + (n.sub ? 3 : 7));
          ne.txt.textContent = lines[0];
        } else {
          ne.txt.setAttribute('y', n.y + (n.sub ? -2 : 2));
          lines.forEach(function (ln, i) {
            var ts = el('tspan', { x: n.x, dy: i ? 13 : 0 });
            ts.textContent = ln;
            ne.txt.appendChild(ts);
          });
        }
        if (ne.sub) ne.sub.textContent = t(n.sub);
      });
      Object.keys(edgeEls).forEach(function (key) {
        var ee = edgeEls[key];
        if (!ee.lbl) return;
        var len = ee.path.getTotalLength ? ee.path.getTotalLength() : 0;
        var p = len ? ee.path.getPointAtLength(len / 2) : { x: 0, y: 0 };
        ee.lbl.setAttribute('x', p.x);
        ee.lbl.setAttribute('y', p.y - 6);
        ee.lbl.textContent = t(ee.def.label);
      });
      render();
    }

    // a step may fire one edge (`edge`) or several at once (`edges`)
    function edgesOf(s) {
      if (!s) return [];
      return s.edges ? s.edges : (s.edge ? [s.edge] : []);
    }

    // which nodes/edges have been reached by step index i
    function reached(i) {
      var ns = {}, es = {};
      for (var k = 0; k <= i; k++) {
        var s = spec.steps[k];
        if (!s) continue;
        edgesOf(s).forEach(function (key) {
          es[key] = true;
          var parts = key.split('->');
          ns[parts[0]] = true; ns[parts[1]] = true;
        });
        if (s.node) ns[s.node] = true;
        (s.show || []).forEach(function (id) { ns[id] = true; });
      }
      return { n: ns, e: es };
    }

    function render() {
      var idle = cur < 0;
      var r = reached(cur);
      var active = spec.steps[cur] || null;
      var hotEdges = edgesOf(active);
      var hotNodes = {};
      hotEdges.forEach(function (k) { hotNodes[k.split('->')[1]] = true; });
      if (active && active.node) hotNodes[active.node] = true;

      spec.nodes.forEach(function (n) {
        var ne = nodeEls[n.id];
        var on = idle || r.n[n.id];
        ne.g.classList.toggle('dim', !on);
        var isHot = !!hotNodes[n.id];
        ne.g.classList.toggle('hot', isHot);
        ne.shape.setAttribute('fill', isHot
          ? 'color-mix(in srgb, ' + ne.kind.c + ' 14%, var(--surface))'
          : 'var(--surface)');
      });

      Object.keys(edgeEls).forEach(function (key) {
        var ee = edgeEls[key];
        var on = idle || r.e[key];
        ee.path.style.opacity = on ? 1 : .25;
        var hot = hotEdges.indexOf(key) >= 0;
        ee.path.classList.toggle('hot', hot);
        ee.path.setAttribute('marker-end', 'url(#' + uid + (hot ? 'arrowHot' : 'arrow') + ')');
        if (ee.lbl) ee.lbl.style.opacity = on ? 1 : .25;
      });

      if (idle) {
        say.className = 'dsay idle';
        say.textContent = strings.hint[lang];
      } else {
        say.className = 'dsay';
        say.innerHTML = '';
        var k = document.createElement('span');
        k.className = 'k';
        k.textContent = (strings.step[lang] || 'Step %s').replace('%s', cur + 1);
        say.appendChild(k);
        say.appendChild(document.createTextNode(t(active.say)));
      }

      count.textContent = (cur < 0 ? 0 : cur + 1) + ' / ' + spec.steps.length;
      bPrev.disabled = cur < 0;
      bNext.disabled = cur >= spec.steps.length - 1;
      bPlay.textContent = playing ? strings.pause[lang] : strings.play[lang];
      bPrev.textContent = strings.prev[lang];
      bNext.textContent = strings.next[lang];
      bReset.textContent = strings.reset[lang];
    }

    // animate one token per edge; `done` fires when the slowest finishes
    function flyTokens(keys, done) {
      var live = keys.filter(function (k) {
        return edgeEls[k] && edgeEls[k].path.getTotalLength;
      });
      if (!live.length || reduce) { hideTokens(); return done && done(); }

      var runs = live.map(function (key, i) {
        var path = edgeEls[key].path;
        var len = path.getTotalLength();
        return { path: path, len: len, dot: tokenAt(i), dur: Math.max(420, Math.min(1100, len * 3.2)) };
      });
      var maxDur = Math.max.apply(null, runs.map(function (r) { return r.dur; }));
      var t0 = performance.now();
      hideTokens();
      runs.forEach(function (r) { r.dot.setAttribute('opacity', 1); });
      cancelAnimationFrame(raf);

      (function tick(now) {
        var elapsed = now - t0;
        runs.forEach(function (r) {
          var k = Math.min(1, elapsed / r.dur);
          var ease = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
          var p = r.path.getPointAtLength(r.len * ease);
          r.dot.setAttribute('cx', p.x); r.dot.setAttribute('cy', p.y);
          if (k >= 1) r.dot.setAttribute('opacity', 0);
        });
        if (elapsed < maxDur) raf = requestAnimationFrame(tick);
        else { hideTokens(); done && done(); }
      })(t0);
    }

    function goto(i, andThen) {
      cur = Math.max(-1, Math.min(spec.steps.length - 1, i));
      render();
      var keys = edgesOf(spec.steps[cur]);
      if (keys.length) flyTokens(keys, andThen);
      else { hideTokens(); andThen && andThen(); }
    }

    function stop() {
      playing = false;
      clearTimeout(timer); cancelAnimationFrame(raf);
      hideTokens();
      render();
    }

    function play() {
      if (playing) return stop();
      playing = true;
      if (cur >= spec.steps.length - 1) cur = -1;
      render();
      (function advance() {
        if (!playing) return;
        if (cur >= spec.steps.length - 1) { playing = false; render(); return; }
        goto(cur + 1, function () {
          if (!playing) return;
          timer = setTimeout(advance, reduce ? 1400 : 620);
        });
      })();
    }

    bPlay.onclick = play;
    bPrev.onclick = function () { stop(); goto(cur - 1); };
    bNext.onclick = function () { stop(); goto(cur + 1); };
    bReset.onclick = function () { stop(); cur = -1; render(); };

    labels();

    return {
      setLang: function (l) { lang = l; labels(); },
      destroy: stop
    };
  }

  window.Diagram = { create: create, KINDS: KINDS };
})();

</script>

window.GLOSSARY = {

  },
  'Agent': {

  },
  'Prompt': {
    zh: '提示词。你发给模型的那段指令文字，决定了模型这一步该干什么。',
    en: 'The instruction text you send the model — it defines what this one step should do.'
  },
  'Token': {
    zh: '模型处理文字的最小单位，大约相当于半个中文词或一小截英文单词。计费和长度限制都按它算。',
    en: 'The unit a model reads and bills by — roughly a word-piece.'
  },
  'Context Window': {
    zh: '上下文窗口。模型一次能「看见」的文字总量上限，超了就得丢掉一部分内容。',
    en: 'The maximum amount of text a model can see at once; past that, something has to be dropped.'
  },
  'JSON': {
    zh: '一种结构化数据格式，像带标签的表格。让模型输出 JSON，下一步程序才好精确解析。',
    en: 'A structured data format. Asking the model for JSON makes its output safe to parse.'
  },
  'API': {
    zh: '程序之间互相调用的接口。查天气、发邮件、读数据库，都是通过它。',
    en: 'The interface one program calls another through — weather, email, databases.'
  },
  'Function Calling': {
    zh: '函数调用。模型不直接执行代码，而是输出一个「我要调用哪个函数、参数是什么」的结构化请求，由外层程序去真正执行。',
    en: 'The model emits a structured "call this function with these arguments" request; your code actually runs it.'
  },
  'Latency': {
    zh: '延迟。从你发出请求到拿到结果之间的等待时间。',
    en: 'The wait between sending a request and getting the result.'
  },
  'Hallucination': {
    zh: '幻觉。模型一本正经地编出不存在的事实。信息不足或任务太重时尤其容易发生。',
    en: 'When a model confidently invents facts — most likely when it lacks information or is overloaded.'
  },
  'Orchestration': {
    zh: '编排。负责决定各个步骤、工具、Agent 按什么顺序被调用的那层逻辑。',
    en: 'The layer deciding what runs in which order — steps, tools, agents.'
  },
  'Embedding': {
    zh: '把一段文字转换成一串数字（向量），意思相近的文字数字也相近，用来做语义搜索和判重。',
    en: 'Text turned into numbers so that similar meanings land close together — used for semantic search.'
  },
  'RAG': {
    zh: '检索增强生成（Retrieval-Augmented Generation）。先去知识库里搜相关资料，再把资料塞给模型让它照着答，能大幅减少瞎编。',
    en: 'Retrieval-Augmented Generation — fetch relevant documents first, then let the model answer from them.'
  },
  'MCP': {
    zh: '模型上下文协议（Model Context Protocol）。一套让 Agent 以统一方式接入各种外部工具和数据源的开放标准。',
    en: 'Model Context Protocol — an open standard for plugging agents into external tools and data uniformly.'
  },
  'A2A': {
    zh: 'Agent 之间通信的协议（Agent-to-Agent），让不同团队、不同框架做的 Agent 也能互相协作。',
    en: 'Agent-to-Agent communication — lets agents from different teams and frameworks work together.'
  },
  'LangChain': {
    zh: '最流行的 Agent 开发框架之一，提供把提示、模型、工具串起来的现成积木。',
    en: 'A popular framework providing ready-made building blocks for chaining prompts, models and tools.'
  },
  'LangGraph': {
    zh: 'LangChain 的图结构版本，用「节点 + 状态」来描述带循环和分支的复杂流程。',
    en: 'LangChain\'s graph flavour — nodes plus shared state, for flows with branches and loops.'
  },
  'CrewAI': {
    zh: '一个专注多 Agent 协作的框架，用「角色 + 任务」的方式组织一支 Agent 团队。',

  'ADK': {

  'Chain-of-Thought': {

  },
  'ReAct': {
    zh: '一种「边想边做」的循环：思考 → 调用工具 → 看结果 → 再思考，直到解决问题。',

  },
  'Guardrail': {
    zh: '护栏。在输入进模型前和输出给用户前加的安全检查，挡住有害、越权或跑题的内容。',
    en: 'Safety checks before input reaches the model and before output reaches the user.'
  },
  'Fine-tuning': {

  },
  'Vector Database': {
    zh: '向量数据库。专门存 Embedding 的数据库，能快速找出「意思最接近」的内容。',
    en: 'A database of embeddings that can quickly find the closest meanings.'
  },
  'Sub-agent': {
    zh: '子 Agent。被主 Agent 调用来负责某一小块工作的专门 Agent。',
    en: 'A specialised agent invoked by a main agent to handle one slice of the work.'
  },
  'In-Context Learning': {
    zh: '上下文学习。模型仅凭提示里给的示例就学会一个新任务、不需要重新训练。这是 Few-Shot 之所以有效的底层机制。',
    en: 'Learning a new task purely from examples in the prompt, with no retraining — the mechanism behind few-shot.'
  },
  'Few-Shot': {
    zh: '少样本提示。在提示里给几个任务示例来引导模型，尤其适合传达难以用语言描述的格式和风格要求。',
    en: 'Giving a few worked examples in the prompt — especially good for format and style, which are hard to describe in words.'
  },
  'Zero-Shot': {
    zh: '零样本提示。不给任何示例，直接下指令。最省 token，但对格式和风格的控制最弱。',
    en: 'No examples, just the instruction. Cheapest in tokens, weakest control over format and style.'
  },
  'Multimodality': {
    zh: '多模态。模型能同时处理文字、图像、音频等多种输入，这决定了 Agent 能不能处理截图、表单、录音这类真实输入。',
    en: 'Handling text, images and audio together — what decides whether an agent can take screenshots, forms and recordings.'
  },
  'Transformer': {
    zh: '当代绝大多数 LLM 的底层神经网络架构，核心创新是自注意力机制，能高效处理长文本并捕捉词之间的复杂关系。',
    en: 'The neural architecture under nearly all modern LLMs; its key innovation, self-attention, handles long sequences and captures relationships between words.'

  'Mixture of Experts': {
    zh: '混合专家（MoE）。一种高效架构：用一个路由网络为每个输入动态挑选少数「专家」子网络来处理，从而在参数量极大的同时控制住计算成本。',
    en: 'A router network dynamically selects a few expert sub-networks per input, allowing huge parameter counts at manageable compute cost.'
  },
  'State': {
    zh: '状态。流程运行到当前为止攒下来的数据，各个步骤靠读写它来传递信息。',
    en: 'The data accumulated so far in a run; steps pass information by reading and writing it.'
  }
};

  function rich(str, noGloss) {

    ctl.appendChild(sw);

    var rb = h('button', 'tb-btn', esc(t(S.reset)));
    rb.onclick = function () {
      if (!confirm(t(S.resetAsk))) return;
      prog = {}; saveProg(); buildRail(); paintProgress(); renderHome();
    };
    ctl.appendChild(rb);
    view.appendChild(ctl);

    // path ordering numbers
    var order = {};
    P.filter(function (p) { return p.core; })
      .sort(function (a, b) { return a.num - b.num; })
      .forEach(function (p, i) { order[p.id] = i + 1; });

    var d = 0;
    PARTS.forEach(function (part) {
      var list = P.filter(function (p) { return p.part === part.n; });
      if (!list.length) return;
      var sec = h('section', 'partsec');
      sec.dataset.part = part.n;
      var hd = h('div', 'parthd');
      hd.innerHTML = '<span class="pn">Part ' + part.n + '</span><h2>' + esc(t(part.name)) +
        '</h2><span class="pd">' + esc(t(part.desc)) + '</span>';
      sec.appendChild(hd);

      var grid = h('div', 'cards');
      list.forEach(function (p) {
        var a = document.createElement('a');
        a.className = 'card' + (p.core ? ' core' : '');
        a.href = '#/p/' + p.id;
        a.dataset.key = (t(p.name) + ' ' + p.name.en + ' ' + p.name.zh + ' ' + t(p.oneLiner) + ' ' + (p.keywords || '')).toLowerCase();
        a.style.animationDelay = (Math.min(d++, 16) * 32) + 'ms';
        var done = isDone(p.id), seen = isSeen(p.id);
        a.innerHTML =
          '<span class="step">' + (order[p.id] || '') + '</span>' +
          '<div class="top"><span class="icon">' + p.icon + '</span>' +
            '<div><h3>' + esc(t(p.name)) + '</h3><div class="en">' + esc(p.name.en) + '</div></div>' +
            (p.kind ? '' : '<span class="num">' + String(p.num).padStart(2, '0') + '</span>') + '</div>' +
          '<p class="one">' + rich(p.oneLiner, true) + '</p>' +
          '<div class="foot">' +
            (p.core ? '<span class="tag core">' + esc(t(S.core)) + '</span>' : '<span class="tag">' + esc(t(S.later)) + '</span>') +
            '<span class="status' + (done ? ' done' : '') + '">' +
              (done ? '✓ ' + esc(t(S.scored)) + ' ' + prog[p.id].right + '/' + p.quiz.length
                    : (seen ? esc(t(S.seen)) : esc(t(S.unseen)))) +
            '</span></div>';
        grid.appendChild(a);
      });
      sec.appendChild(grid);
      view.appendChild(sec);
    });

    view.appendChild(h('div', 'empty', esc(t(S.noResult)))).style.display = 'none';
    var empty = view.lastChild;

    input.oninput = function () {
      var q = input.value.trim().toLowerCase();
      var any = 0;
      [].forEach.call(view.querySelectorAll('.card'), function (c) {
        var hit = !q || c.dataset.key.indexOf(q) >= 0;
        c.classList.toggle('hidden', !hit);
        if (hit) any++;
      });
      [].forEach.call(view.querySelectorAll('.partsec'), function (s) {
        s.style.display = s.querySelectorAll('.card:not(.hidden)').length ? '' : 'none';
      });
      empty.style.display = any ? 'none' : '';
    };

    document.body.classList.toggle('pathmode', pathMode);
    markRail(null);
  }

  // ---------- build path ----------
  function renderBuild() {
    view.innerHTML = '';
    document.body.classList.remove('pathmode');
    document.title = t(S.buildTitle) + ' · Agentic Patterns Lab';
    var B = window.BUILD_PATH || { steps: [] };

    view.appendChild(h('div', 'crumb', '<a href="#/">← ' + esc(t(S.home)) + '</a>'));

    var hd = h('header', 'phd');
    hd.innerHTML = '<div class="row"><span class="icon">🔨</span><div>' +
      '<div class="no">' + esc(t(S.lSteps)) + '</div>' +
      '<h1>' + esc(t(S.buildTitle)) + '</h1>' +
      '<div class="alias">' + rich(t(B.lede || S.buildLede)) + '</div></div></div>';
    view.appendChild(hd);

    // 环境准备：在所有步骤之前，因为跑不起来就什么都别谈
    if (B.setup) {
      var su = h('section', 'sec buildstep bs-setup');
      su.innerHTML =
        '<div class="bs-head"><span class="bs-n">⚙</span>' +
        '<div><h2>' + esc(t(B.setup.title)) + '</h2>' +
        '<div class="bs-goal">' + rich(B.setup.goal) + '</div></div></div>' +
        '<p class="bs-body">' + rich(B.setup.body) + '</p>' +
        (B.setup.code ? '<pre class="code">' + B.setup.code.map(function (l) {
          return '<span class="ln">' + hi(l) + '</span>'; }).join('') + '</pre>' : '') +
        (B.setup.note ? '<div class="bs-note">' + rich(B.setup.note) + '</div>' : '');
      view.appendChild(su);
    }

    B.steps.forEach(function (s, i) {
      var sec = h('section', 'sec buildstep');
      var chips = (s.patterns || []).filter(function (id) { return byId[id]; })
        .map(function (id) {
          var q = byId[id];
          return '<a class="chip" href="#/p/' + q.id + '"><span>' + q.icon + '</span><span>' +
            esc(t(q.name)) + '</span></a>';
        }).join('');
      sec.innerHTML =
        '<div class="bs-head"><span class="bs-n">' + (s.n !== undefined ? s.n : i + 1) + '</span>' +
        '<div><h2>' + esc(t(s.title)) + '</h2>' +
        '<div class="bs-goal">' + rich(s.goal) + '</div></div></div>' +
        (s.file ? '<div class="bs-file">' + esc(s.file) + '</div>' : '') +
        '<p class="bs-body">' + rich(s.body) + '</p>' +
        (s.run ? '<div class="bs-run"><span class="p">$</span><code>' + esc(s.run) + '</code></div>' : '') +
        (s.code ? '<pre class="code">' + s.code.map(function (l) {
          return '<span class="ln">' + hi(l) + '</span>'; }).join('') + '</pre>' : '') +
        (s.output ? '<div class="bs-out"><b>' + esc(t(S.bsOut)) + '</b><pre>' +
          esc(s.output.join('\n')) + '</pre>' +
          '<em>' + esc(t(s.outputNote || S.bsOutVaries)) + '</em></div>' : '') +
        (s.watch ? '<div class="bs-watch"><b>' + esc(t(S.bsWatch)) + '</b>' + rich(s.watch) + '</div>' : '') +
        (chips ? '<div class="bs-rel"><span>' + esc(t(S.bsRel)) + '</span><div class="chips">' + chips + '</div></div>' : '');
      view.appendChild(sec);
    });

    markRail('__build');
    window.scrollTo(0, 0);
  }

  // ---------- pattern page ----------
  function renderPattern(p) {
    view.innerHTML = '';
    document.body.classList.remove('pathmode');
    document.title = t(p.name) + ' · Agentic Patterns Lab';

    prog[p.id] = prog[p.id] || {};
    prog[p.id].viewed = true;
    saveProg();

    var partName = (PARTS.filter(function (x) { return x.n === p.part; })[0] || {}).name;
    var crumb = h('div', 'crumb', '<a href="#/">← ' + esc(t(S.home)) + '</a>　/　' +
      esc(partName ? t(partName) : 'Part ' + p.part));
    view.appendChild(crumb);

    var eyebrow = p.kind
      ? esc(t(p.label || { zh: '基础', en: 'Foundations' }))
      : 'Pattern ' + String(p.num).padStart(2, '0') + (p.core ? ' · ' + esc(t(S.core)) : '');

    var hd = h('header', 'phd');
    hd.innerHTML = '<div class="row"><span class="icon">' + p.icon + '</span><div>' +
      '<div class="no">' + eyebrow + '</div>' +
      '<h1>' + esc(t(p.name)) + '</h1>' +
      '<div class="alias">' + esc(p.name.en) + (p.alias ? '　·　' + esc(t(S.alsoCalled)) + ' ' + esc(t(p.alias)) : '') + '</div>' +
      '</div></div>';
    view.appendChild(hd);

    // 1. one-liner
    view.appendChild(section('lOne', h('p', 'oneliner', rich(p.oneLiner))));

    // 2. analogy
    if (p.analogy) {
      var an = h('div', 'analogy');
      an.innerHTML = '<span class="big">' + p.analogy.icon + '</span><div><h3>' +
        esc(t(p.analogy.title)) + '</h3><p>' + rich(p.analogy.body) + '</p></div>';
      view.appendChild(section('lAnalogy', an));
    }

    // 3. problem / solution
    if (p.problem && p.solution) {
      var duo = h('div', 'duo');
      duo.innerHTML =
        '<div class="panel bad"><div class="ph">▲ ' + esc(t(S.hProblem)) + '</div><p>' + rich(p.problem) + '</p></div>' +
        '<div class="panel good"><div class="ph">● ' + esc(t(S.hSolution)) + '</div><p>' + rich(p.solution) + '</p></div>';
      view.appendChild(section('lProblem', duo));
    }

    // 4. diagram
    if (p.diagram) {
      var host = document.createElement('div');
      view.appendChild(section('lDiagram', host));
      var inst = window.Diagram.create(host, p.diagram, lang, {
        hint: S.dHint, play: S.dPlay, pause: S.dPause,
        prev: S.dPrev, next: S.dNext, reset: S.dReset,
        step: S.dStep
      });
      liveDiagrams.push(inst);
    }

    // 5. before / after
    if (p.without && p.with) {
      var cmp = h('div', 'duo');
      cmp.innerHTML =
        '<div class="panel bad"><div class="ph">✕ ' + esc(t(S.hBad)) + '</div><p>' + rich(p.without) + '</p></div>' +
        '<div class="panel good"><div class="ph">✓ ' + esc(t(S.hGood)) + '</div><p>' + rich(p.with) + '</p></div>';
      view.appendChild(section('lCompare', cmp));
    }

    // 6. when to use / not
    if (p.whenToUse && p.whenNotToUse) {
      var ul = h('div', 'uselists');
      var mk = function (cls, head, items) {
        return '<div class="panel uselist ' + cls + '"><div class="ph">' + head + '</div><ul>' +
          items.map(function (i) { return '<li>' + rich(i) + '</li>'; }).join('') + '</ul></div>';
      };
      ul.innerHTML =
        mk('yes good', '✓ ' + esc(t(S.hYes)), p.whenToUse) +
        mk('no bad', '✕ ' + esc(t(S.hNo)), p.whenNotToUse);
      view.appendChild(section('lWhen', ul));
    }

    // 6.5 hard knowledge
    if (p.deepDive && p.deepDive.length) {
      var facts = h('div', 'facts');
      facts.innerHTML = p.deepDive.map(function (f) {
        return '<div class="fact"><h4>' + rich(f.t, true) + '</h4><p>' + rich(f.d) + '</p></div>';
      }).join('');
      view.appendChild(section('lDeep', facts));
    }

    // 7. code
    if (p.code) {
      var det = document.createElement('details');
      det.className = 'codewrap';
      var sum = document.createElement('summary');
      sum.textContent = t(S.codeHead);
      det.appendChild(sum);
      var pre = h('pre', 'code');
      pre.innerHTML = p.code.map(function (l) {
        return '<span class="ln">' + hi(l) + '</span>';
      }).join('');
      det.appendChild(pre);
      view.appendChild(section('lCode', det));
    }

    // 8. use cases
    if (p.useCases && p.useCases.length) {
      var ol = h('ul', 'bul');
      ol.innerHTML = p.useCases.map(function (c) { return '<li>' + rich(c) + '</li>'; }).join('');
      view.appendChild(section('lCases', ol));
    }

    // 8.5 canonical terminology — the bridge to the book and to other people
    if (p.terms && p.terms.length) {
      var tw = h('div', 'terms');
      tw.innerHTML = p.terms.map(function (x) {
        return '<div class="tm"><div class="tm-en">' + esc(x.en) + '</div>' +
          '<div class="tm-zh">' + esc(t(x.zh)) + '</div>' +
          '<p>' + rich(x.d, true) + '</p></div>';
      }).join('');
      view.appendChild(section('lTerms', tw));
    }

    // 8.6 primary sources from the book's own reference list
    if (p.refs && p.refs.length) {
      var rl = h('ul', 'refs');
      rl.innerHTML = p.refs.map(function (r) {
        var tag = r.kind ? '<span class="rk ' + r.kind + '">' + esc(r.kind) + '</span>' : '';
        var name = esc(r.title);
        return '<li>' + tag + (r.url
          ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + name + '</a>'
          : '<span>' + name + '</span>') +
          (r.note ? '<em>' + esc(t(r.note)) + '</em>' : '') + '</li>';
      }).join('');
      view.appendChild(section('lRefs', rl));
    }

    // 9. quiz
    if (p.quiz && p.quiz.length) view.appendChild(section('lQuiz', quizBlock(p)));

    // 10. related
    if (p.related && p.related.length) {
      var chips = h('div', 'chips');
      chips.innerHTML = p.related.filter(function (r) { return byId[r]; }).map(function (r) {
        var q = byId[r];
        return '<a class="chip" href="#/p/' + q.id + '"><span>' + q.icon + '</span>' +
          '<span>' + esc(t(q.name)) + '</span>' +
          (q.kind ? '' : '<span class="n">' + String(q.num).padStart(2, '0') + '</span>') + '</a>';
      }).join('');
      view.appendChild(section('lRelated', chips));
    }

    // 11. 动手做：反向链接到实战路径里用到这个模式的那一步
    var uses = ((window.BUILD_PATH || {}).steps || []).filter(function (s) {
      return (s.patterns || []).indexOf(p.id) !== -1;
    });
    if (uses.length) {
      var hands = h('div', 'handson');
      hands.innerHTML =
        '<div class="ho-h"><span>🔨</span><b>' + esc(t(S.hoTitle)) + '</b></div>' +
        uses.map(function (s) {
          return '<a class="ho-row" href="#/build">' +
            '<span class="ho-n">' + s.n + '</span>' +
            '<span class="ho-t">' + esc(t(s.title)) + '</span>' +
            (s.file ? '<code>' + esc(s.file) + '</code>' : '') + '</a>';
        }).join('');
      view.appendChild(hands);
    }

    // prev / next
    var i = P.indexOf(p), nav = h('div', 'pagenav');
    if (P[i - 1]) nav.appendChild(navLink(P[i - 1], 'prev'));
    if (P[i + 1]) nav.appendChild(navLink(P[i + 1], 'next'));
    view.appendChild(nav);

    if (p.pages) {
      view.appendChild(h('div', 'srcnote',
        esc(t(S.src)) + ' · ' + (p.chapter || ('Chapter ' + p.num)) +
        ' · ' + esc(t(S.page)) + ' ' + p.pages));
    }

    markRail(p.id);
    window.scrollTo(0, 0);
  }

  function navLink(p, dir) {
    var a = document.createElement('a');
    a.className = dir; a.href = '#/p/' + p.id;
    a.innerHTML = '<div class="d">' + (dir === 'prev' ? '← ' + esc(t(S.prev)) : esc(t(S.next)) + ' →') +
      '</div><div class="t">' + p.icon + ' ' + esc(t(p.name)) + '</div>';
    return a;
  }

  // ---------- quiz ----------
  function quizBlock(p) {
    var box = document.createElement('div');
    var right = 0, answered = 0;
    var score = h('div', 'quizscore', '');

    p.quiz.forEach(function (q, qi) {
      var card = h('div', 'quiz');
      card.appendChild(h('div', 'q', '<span class="qn">Q' + (qi + 1) + '</span>' + rich(q.q, true)));
      var btns = [];
      q.options.forEach(function (o, oi) {
        var b = h('button', 'opt', '<span class="mk">' + 'ABCD'[oi] + '</span>' + rich(o, true));
        b.onclick = function () {
          btns.forEach(function (x) { x.disabled = true; });
          var ok = oi === q.answer;
          b.classList.add(ok ? 'right' : 'wrong');
          if (!ok) btns[q.answer].classList.add('right');
          answered++; if (ok) right++;
          var w = h('div', 'why', '<span class="k">' + esc(t(S.why)) + '</span>' + rich(q.why, true));
          card.appendChild(w);
          if (answered === p.quiz.length) {
            prog[p.id] = prog[p.id] || {};
            prog[p.id].right = right;
            prog[p.id].total = p.quiz.length;
            saveProg(); buildRail(); paintProgress();
            score.innerHTML = esc(t(S.scored)) + ' <b>' + right + ' / ' + p.quiz.length + '</b>' +
              (right === p.quiz.length ? '　' + esc(t(S.allRight)) : '');
          }
        };
        btns.push(b);
        card.appendChild(b);
      });
      box.appendChild(card);
    });
    box.appendChild(score);
    return box;
  }

  // ---------- tiny python highlighter ----------
  function hi(line) {
    var s = esc(line);
    var cm = s.indexOf('#');
    var code = cm >= 0 ? s.slice(0, cm) : s;
    var note = cm >= 0 ? s.slice(cm) : '';
    code = code
      .replace(/(&quot;[^&]*?&quot;|'[^']*?')/g, '<span class="st">$1</span>')
      .replace(/\b(def|return|for|in|if|else|elif|while|import|from|class|await|async|with|as|not|and|or|try|except|yield|lambda|True|False|None)\b/g, '<span class="kw">$1</span>')
      .replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="nu">$1</span>')
      .replace(/([A-Za-z_][A-Za-z0-9_]*)\(/g, '<span class="fn">$1</span>(');
    return code + (note ? '<span class="cm">' + note + '</span>' : '');
  }

  // ---------- glossary tooltip ----------
  function showTip(el) {
    var k = el.dataset.t, g = window.GLOSSARY[k];
    if (!g) return;
    tip.innerHTML = '<span class="tn">' + esc(k) + '</span>' + esc(t(g));
    tip.classList.add('show');
    var r = el.getBoundingClientRect();
    tip.style.left = Math.max(10, Math.min(window.innerWidth - 300, r.left)) + 'px';
    var top = r.bottom + 8;
    if (top + tip.offsetHeight > window.innerHeight - 10) top = r.top - tip.offsetHeight - 8;
    tip.style.top = top + 'px';
  }
  function hideTip() { tip.classList.remove('show'); }

  document.addEventListener('mouseover', function (e) {
    var el = e.target.closest && e.target.closest('.term');
    if (el) showTip(el);
  });
  document.addEventListener('mouseout', function (e) {
    if (e.target.closest && e.target.closest('.term')) hideTip();
  });
  document.addEventListener('click', function (e) {
    var el = e.target.closest && e.target.closest('.term');
    if (el) { showTip(el); e.preventDefault(); } else hideTip();
  });
  window.addEventListener('scroll', hideTip, { passive: true });

  // ---------- routing ----------
  function route() {
    liveDiagrams.forEach(function (d) { d.destroy(); });
    liveDiagrams = [];
    var m = /^#\/p\/(.+)$/.exec(location.hash);
    if (location.hash === '#/build') renderBuild();
    else if (m && byId[m[1]]) renderPattern(byId[m[1]]);
    else renderHome();
    rail.classList.remove('open');
    document.getElementById('scrim').classList.remove('on');
  }

  // ---------- chrome ----------
  function applyLang() {
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.getElementById('brandSub').textContent = t(S.sub);
    document.getElementById('btnZh').setAttribute('aria-pressed', lang === 'zh');
    document.getElementById('btnEn').setAttribute('aria-pressed', lang === 'en');
    // 页脚是静态节点，不经过 route() 重绘，所以在这里跟着语言一起更新。
    // 用 innerHTML 是因为文案里有 <b>/<i>，内容全部来自本文件的常量，不涉及外部输入。
    document.getElementById('footAbout').innerHTML = t(S.footAbout);
    document.getElementById('footDisclaim').textContent = t(S.footDisclaim);
    buildRail(); route();
  }
  function setLang(l) {
    if (l === lang) return;
    lang = l; localStorage.setItem('apl.lang', l); applyLang();
  }
  document.getElementById('btnZh').onclick = function () { setLang('zh'); };
  document.getElementById('btnEn').onclick = function () { setLang('en'); };

  function systemPrefersDark() {
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function applyTheme() {
    if (theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('apl.theme', theme);
    } else {
      // no pin: let the CSS media query follow the OS
      document.documentElement.removeAttribute('data-theme');
    }
  }
  document.getElementById('btnTheme').onclick = function () {
    var current = theme || (systemPrefersDark() ? 'dark' : 'light');
    theme = current === 'light' ? 'dark' : 'light';
    applyTheme();
  };

  var rt = document.getElementById('railToggle'), scrim = document.getElementById('scrim');
  rt.onclick = function () {
    var open = rail.classList.toggle('open');
    scrim.classList.toggle('on', open);
  };
  scrim.onclick = function () { rail.classList.remove('open'); scrim.classList.remove('on'); };

  window.addEventListener('hashchange', route);

  applyTheme();
  buildRail();
  paintProgress();
  applyLang();
})();

</script>
